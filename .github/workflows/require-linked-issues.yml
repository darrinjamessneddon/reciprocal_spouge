name: Require linked issues

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  require-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR description contains linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            // Matches the issue-linking phrases documented in the PR template:
            // e.g., "Fixes #123", "Closes owner/repo#456", "Related #789", "Related to #101"
            const linkedIssuePattern = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?|related)(\s+to)?\s+([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#\d+\b/i;

            if (!linkedIssuePattern.test(body)) {
              core.setFailed(
                "PR description must link an issue using a supported keyword such as 'Fixes #123', 'Closes owner/repo#123', or 'Related #123'."
              );
            } else {
              core.info("✅ Linked issue reference found in PR description.");
            }
