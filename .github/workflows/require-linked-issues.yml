name: Require linked issues

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  contents: read

jobs:
  require-linked-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR description contains linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            // Matches common closing keywords + issue reference:
            // e.g., "Fixes #123", "Fixes issue #123", "Closes owner/repo#456", "Resolves #789"
            const linkedIssuePattern = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+(issue\s+)?([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)?#\d+\b/i;

            if (!linkedIssuePattern.test(body)) {
              core.setFailed(
                "PR description must link an issue using a closing keyword, e.g. 'Closes #123' or 'Fixes owner/repo#123'."
              );
            } else {
              core.info("✅ Linked issue reference found in PR description.");
            }
