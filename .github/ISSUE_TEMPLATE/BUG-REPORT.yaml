name: "🐛 Bug Report"
description: "File a structured report to help us identify and fix a bug."
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: "Description of the Bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "Tell us what went wrong..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "List the exact steps required to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: "Expected vs. Actual Behavior"
      description: "What did you expect to happen, and what actually happened?"
      placeholder: "Expected: ... \nActual: ..."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "What OS were you using when you encountered the bug?"
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
    validations:
      required: false

  - type: checkboxes
    id: checkboxes
    attributes:
      label: "Validation Checks"
      description: "Please check the boxes below before submitting."
      options:
        - label: "I have searched existing issues to ensure this bug has not already been reported."
          required: true
        - label: "I am using the latest version of this software."
          required: false

