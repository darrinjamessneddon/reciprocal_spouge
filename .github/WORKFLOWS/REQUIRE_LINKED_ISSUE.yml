url=https://github.com/owner/repo/blob/main/.github/workflows/require-linked-issue.yml
name: Require linked issue

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  require-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR body contains issue reference
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const regex = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+\b/i;
            if (!regex.test(body)) {
              core.setFailed(
                "PR description must include a closing keyword and issue number, e.g. 'Closes #123'."
              );
            }
